<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1340" viewBox="0 0 1340 1340"><rect width="1340" height="1340" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#52657c" stroke-width="1.4"/></marker></defs><text x="35" y="54.0" fill="#283548" font-size="34" font-family="Apple SD Gothic Neo, sans-serif">팀의 지식과 데이터를 연결하는 LLM Wiki</text><text x="35" y="90.0" fill="#596579" font-size="18" font-family="Apple SD Gothic Neo, sans-serif">설계안 · 실선: 기본 흐름 / 점선: 연동 방식과 데이터 확인 필요</text><rect x="35" y="140" width="350" height="145" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" /><text x="55" y="178.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">지식의 원본</text><text x="55" y="215.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">Confluence 회의록 · 설계 · 메모</text><text x="55" y="241.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">저장소의 모델 코드 · DB 정의</text><rect x="35" y="350" width="350" height="155" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" /><text x="55" y="388.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">LLM 정리 → 팀원 확인</text><text x="55" y="425.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">출처를 연결해 변경안 작성</text><text x="55" y="451.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">제안 / 확정 / 확인 필요 구분</text><rect x="35" y="570" width="350" height="220" rx="16" fill="#e7f3ed" stroke="#52657c" stroke-width="2" /><text x="55" y="608.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">팀 Wiki  |  Confluence</text><text x="55" y="645.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">예측 모델 · 도메인 용어 · DB 사전</text><text x="55" y="671.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">팀의 결정 · 미정 사항</text><text x="55" y="698.2" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">지표 정의 · 검토한 분석 결과</text><path d="M210 285 l0 65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><path d="M210 505 l0 65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><rect x="475" y="140" width="380" height="145" rx="16" fill="#fff2db" stroke="#52657c" stroke-width="2" /><text x="495" y="178.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">팀원이 질문</text><text x="495" y="215.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">“최근 Day 7 리텐션이</text><text x="495" y="241.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">왜 떨어졌지?”</text><rect x="475" y="350" width="380" height="155" rx="16" fill="#e9e5f6" stroke="#52657c" stroke-width="2" /><text x="495" y="388.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">LLM 에이전트가 분석</text><text x="495" y="425.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">Wiki의 정의와 맥락 참고</text><text x="495" y="451.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">도구로 데이터 조회 · 연결 · 계산</text><rect x="475" y="570" width="380" height="155" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" /><text x="495" y="608.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">근거가 있는 답변</text><text x="495" y="645.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">확인된 사실 / 원인 후보</text><text x="495" y="671.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">추가로 확인할 사항</text><rect x="475" y="790" width="380" height="145" rx="16" fill="#fff2db" stroke="#52657c" stroke-width="2" /><text x="495" y="828.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">팀원이 검토하고 판단</text><text x="495" y="865.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">추가 조사 · 제품 변경 판단</text><text x="495" y="891.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">검토 결과와 남은 질문을 기록</text><path d="M665 285 l0 65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><path d="M665 505 l0 65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><path d="M665 725 l0 65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><path d="M385 650 l90 -215" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><path d="M475 860 l-265 -70" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" /><text x="55" y="838.0" fill="#283548" font-size="18" font-family="Apple SD Gothic Neo, sans-serif">검토한 배움을 Wiki에 축적</text><rect x="945" y="140" width="360" height="145" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" stroke-dasharray="8 6"/><text x="965" y="178.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">Amplitude</text><text x="965" y="215.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">리텐션 · 이벤트 · 사용자 집단</text><rect x="945" y="350" width="360" height="155" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" stroke-dasharray="8 6"/><text x="965" y="388.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">분석용 데이터</text><text x="965" y="425.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">기간 · 시간대 · 공통 기준 정렬</text><text x="965" y="451.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">전체 데이터를 Wiki에 복사하지 않음</text><rect x="945" y="570" width="360" height="155" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" stroke-dasharray="8 6"/><text x="965" y="608.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">내부 환경에서 집계 반출</text><text x="965" y="645.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">예보 평가 집계 파일 등</text><text x="965" y="671.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">전달 방식은 미정</text><rect x="945" y="790" width="360" height="145" rx="16" fill="#edf3fa" stroke="#52657c" stroke-width="2" stroke-dasharray="8 6"/><text x="965" y="828.0" fill="#283548" font-size="23" font-family="Apple SD Gothic Neo, sans-serif">내부망 DB</text><text x="965" y="865.0" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">외부에서 직접 조회하지 않는 전제</text><text x="965" y="891.6" fill="#283548" font-size="19" font-family="Apple SD Gothic Neo, sans-serif">예보 평가 원본 데이터</text><path d="M1125 285 l0 65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M1125 570 l0 -65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M1125 790 l0 -65" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M945 425 l-90 0" fill="none" stroke="#52657c" stroke-width="2" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="35" y="1006.0" fill="#283548" font-size="21" font-family="Apple SD Gothic Neo, sans-serif">미정: 데이터 연결 키 · 집계 반출 방식 · 지표 정의 · 검토 담당자</text><text x="35" y="1043.0" fill="#596579" font-size="18" font-family="Apple SD Gothic Neo, sans-serif">현재 구현·연동 전 단계입니다. 함께 변한 지표를 원인으로 단정하지 않습니다.</text></svg>